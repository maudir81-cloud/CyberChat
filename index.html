<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberChat</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        whatsapp: {
                            dark: '#111b21',
                            darker: '#0b141a',
                            panel: '#202c33',
                            border: '#374248',
                            green: '#00a884',
                            lightGreen: '#005c4b',
                            bubbleIn: '#202c33',
                            bubbleOut: '#005c4b',
                            text: '#e9edef',
                            subtext: '#8696a0',
                            inputBg: '#2a3942'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: #0b141a;
            color: #e9edef;
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
    </style>
</head>
<body class="h-full w-full flex flex-col">

    <input type="file" id="hidden-file-input" accept="image/*" class="hidden">

    <div id="app" class="h-full w-full flex flex-col relative overflow-hidden">
        <!-- Auth / Login View -->
        <div id="auth-view" class="absolute inset-0 flex items-center justify-center bg-whatsapp-darker p-4 overflow-y-auto z-20">
            <div class="bg-whatsapp-dark w-full max-w-md p-6 sm:p-8 rounded-xl shadow-2xl border border-whatsapp-border flex flex-col items-center my-auto">
                <div class="w-16 h-16 bg-whatsapp-green rounded-full flex items-center justify-center text-3xl text-white mb-4 shadow-lg">
                    <i class="fa-brands fa-whatsapp"></i>
                </div>
                <h1 class="text-2xl font-bold text-whatsapp-text mb-1">CyberChat</h1>
                <p class="text-whatsapp-subtext text-xs mb-6 text-center">Mensagens criptografadas com E2EE & Gemini 3.5 Flash Lite.</p>
                
                <div class="flex w-full bg-whatsapp-inputBg rounded-lg p-1 mb-6 border border-whatsapp-border">
                    <button id="auth-tab-login" type="button" class="flex-1 py-2 text-xs font-semibold rounded-md bg-whatsapp-green text-white transition">Entrar</button>
                    <button id="auth-tab-register" type="button" class="flex-1 py-2 text-xs font-semibold rounded-md text-whatsapp-subtext hover:text-whatsapp-text transition">Criar Conta</button>
                </div>

                <form id="auth-form" class="w-full flex flex-col gap-4">
                    <div>
                        <label class="block text-xs font-medium text-whatsapp-subtext mb-1">Nome de Usuário</label>
                        <input type="text" id="username-input" required placeholder="Seu usuário" class="w-full bg-whatsapp-inputBg border border-whatsapp-border rounded-lg px-4 py-2.5 text-sm text-whatsapp-text focus:outline-none focus:border-whatsapp-green">
                        <span id="username-error" class="text-red-400 text-xs mt-1.5 hidden block"></span>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-whatsapp-subtext mb-1">Senha</label>
                        <input type="password" id="password-input" required placeholder="Sua senha" class="w-full bg-whatsapp-inputBg border border-whatsapp-border rounded-lg px-4 py-2.5 text-sm text-whatsapp-text focus:outline-none focus:border-whatsapp-green">
                    </div>
                    <button type="submit" id="auth-submit-btn" class="w-full bg-whatsapp-green hover:bg-emerald-600 text-white font-semibold py-2.5 rounded-lg transition duration-200 mt-2 shadow flex items-center justify-center gap-2">
                        <span id="auth-btn-text">Entrar na Conta</span>
                    </button>
                </form>
            </div>
        </div>

        <div id="main-view" class="absolute inset-0 flex hidden z-10 overflow-hidden">
            <!-- Sidebar -->
            <div id="sidebar" class="w-full md:w-[380px] lg:w-[420px] h-full bg-whatsapp-dark border-r border-whatsapp-border flex flex-col z-10 shrink-0">
                <div class="bg-whatsapp-panel px-4 py-3 flex items-center justify-between border-b border-whatsapp-border">
                    <div class="flex items-center gap-3 min-w-0">
                        <img id="my-avatar" src="" class="w-10 h-10 rounded-full object-cover border border-whatsapp-border cursor-pointer hover:opacity-80 transition shrink-0" title="Clique para alterar a foto do seu perfil" alt="Perfil">
                        <div class="min-w-0 cursor-pointer group flex-1" id="profile-name-trigger" title="Clique para alterar seu nome">
                            <h3 id="my-name-display" class="font-medium text-sm text-whatsapp-text truncate group-hover:underline">Nome</h3>
                            <span class="text-xs text-whatsapp-subtext block truncate" id="my-phone-display">@user</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 text-whatsapp-subtext text-lg">
                        <button id="btn-settings" title="Configurar Gemini API" class="hover:text-whatsapp-text transition flex items-center gap-1.5 text-xs bg-whatsapp-inputBg px-2.5 py-1.5 rounded-lg border border-whatsapp-border">
                            <i class="fa-solid fa-gear text-whatsapp-green"></i>
                        </button>
                        <!-- Botão de Notificações (Sino) -->
                        <button id="btn-notifications" title="Notificações" class="relative hover:text-whatsapp-text transition flex items-center gap-1.5 text-xs bg-whatsapp-inputBg px-2.5 py-1.5 rounded-lg border border-whatsapp-border">
                            <i class="fa-solid fa-bell text-whatsapp-green"></i>
                            <span id="notification-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold hidden">0</span>
                        </button>
                        <!-- Botão Lupa (Solicitar Conversa) -->
                        <button id="btn-request-chat" title="Solicitar Conversa" class="hover:text-whatsapp-text transition flex items-center gap-1.5 text-xs bg-whatsapp-inputBg px-2.5 py-1.5 rounded-lg border border-whatsapp-border">
                            <i class="fa-solid fa-magnifying-glass text-whatsapp-green"></i>
                        </button>
                        <button id="btn-create-group" title="Criar Grupo" class="hover:text-whatsapp-text transition flex items-center gap-1.5 text-xs bg-whatsapp-inputBg px-2.5 py-1.5 rounded-lg border border-whatsapp-border">
                            <i class="fa-solid fa-users text-whatsapp-green"></i>
                        </button>
                        <button id="btn-logout" title="Sair" class="hover:text-red-400 transition flex items-center gap-1.5 text-xs bg-whatsapp-inputBg px-2.5 py-1.5 rounded-lg border border-whatsapp-border text-whatsapp-subtext">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </div>
                </div>

                <div class="p-2 bg-whatsapp-dark border-b border-whatsapp-border flex items-center gap-2">
                    <div class="flex-1 bg-whatsapp-inputBg rounded-lg flex items-center px-3 py-1.5 gap-3 border border-whatsapp-border focus-within:border-whatsapp-green">
                        <i class="fa-solid fa-magnifying-glass text-whatsapp-subtext text-sm"></i>
                        <input type="text" id="search-input" placeholder="Pesquisar conversas" class="w-full bg-transparent text-sm text-whatsapp-text focus:outline-none placeholder-whatsapp-subtext">
                    </div>
                </div>

                <div class="flex border-b border-whatsapp-border bg-whatsapp-dark text-xs font-semibold text-whatsapp-subtext">
                    <button id="tab-chats" class="flex-1 py-3 border-b-2 border-whatsapp-green text-whatsapp-green text-center transition">CONVERSAS</button>
                    <button id="tab-contacts" class="flex-1 py-3 text-center transition hover:text-whatsapp-text">SEGUIDOS</button>
                </div>

                <div id="sidebar-list" class="flex-1 overflow-y-auto divide-y divide-whatsapp-border/40"></div>
            </div>

            <!-- Chat Main Area -->
            <div id="chat-area" class="flex-1 h-full bg-whatsapp-darker flex flex-col hidden md:flex min-w-0 absolute md:relative inset-0 z-20 md:z-auto">
                <div id="no-chat-selected" class="flex-1 flex flex-col items-center justify-center p-6 text-center bg-whatsapp-darker border-b-8 border-whatsapp-green">
                    <div class="w-48 h-48 opacity-40 mb-6 flex items-center justify-center text-7xl text-whatsapp-subtext">
                        <i class="fa-brands fa-whatsapp"></i>
                    </div>
                    <h2 class="text-2xl font-light text-whatsapp-text mb-2">CyberChat Web</h2>
                    <p class="text-sm text-whatsapp-subtext max-w-md">Selecione uma conversa ou chame a inteligência artificial digitando <b class="text-whatsapp-green">@gemini [sua pergunta]</b> em qualquer chat.</p>
                </div>

                <div id="active-chat" class="flex-1 flex flex-col h-full hidden min-w-0">
                    <div class="bg-whatsapp-panel px-4 py-3 flex items-center justify-between border-b border-whatsapp-border">
                        <div class="flex items-center gap-3 min-w-0">
                            <button id="btn-back-to-list" class="md:hidden text-whatsapp-subtext text-lg mr-1"><i class="fa-solid fa-arrow-left"></i></button>
                            <img id="active-chat-avatar" src="" class="w-10 h-10 rounded-full object-cover border border-whatsapp-border shrink-0 cursor-pointer hover:opacity-80 transition" title="Clique para alterar a foto do grupo" alt="Avatar">
                            <div id="active-chat-name-trigger" class="flex items-center gap-3 cursor-pointer min-w-0 group flex-1" title="Clique para alterar o nome">
                                <div class="min-w-0">
                                    <h3 id="active-chat-name" class="font-medium text-sm text-whatsapp-text truncate group-hover:underline">Nome</h3>
                                    <span id="active-chat-status" class="text-xs text-whatsapp-subtext block truncate">Online</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="messages-container" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2 bg-[radial-gradient(#202c33_1px,transparent_1px)] [background-size:16px_16px] bg-whatsapp-darker"></div>

                    <!-- Input Footer -->
                    <div id="chat-input-footer" class="bg-whatsapp-panel px-4 py-3 flex items-center gap-3 border-t border-whatsapp-border relative">
                        <input type="text" id="message-input" placeholder="Digite uma mensagem ou @gemini..." class="flex-1 bg-whatsapp-inputBg text-whatsapp-text rounded-lg px-4 py-2.5 text-sm focus:outline-none border border-whatsapp-border focus:border-whatsapp-green">
                        <button id="btn-send-message" class="text-whatsapp-subtext text-xl hover:text-whatsapp-green transition">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Custom Modal -->
        <div id="custom-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 hidden p-4">
            <div id="modal-content" class="bg-whatsapp-dark border border-whatsapp-border w-full max-w-md rounded-xl p-6 shadow-2xl flex flex-col">
                <h3 id="modal-title" class="text-lg font-bold text-whatsapp-text mb-4">Título</h3>
                <div id="modal-body" class="mb-6 max-h-[60vh] overflow-y-auto"></div>
                <div id="modal-footer" class="flex justify-end gap-3">
                    <button onclick="closeModal()" class="bg-whatsapp-inputBg hover:bg-whatsapp-border text-whatsapp-text px-4 py-2 rounded-lg text-sm transition">Cancelar</button>
                    <button id="modal-confirm" class="bg-whatsapp-green hover:bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cyberchat-414be';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyBVPT5i8EBEYMR6Ig7hw_0fXXTQNlEJIlg",
            authDomain: "cyberchat-414be.firebaseapp.com",
            databaseURL: "https://cyberchat-414be-default-rtdb.firebaseio.com",
            projectId: "cyberchat-414be",
            storageBucket: "cyberchat-414be.firebasestorage.app",
            messagingSenderId: "865992019962",
            appId: "1:865992019962:web:9fbafccbc9150e415d9e43",
            measurementId: "G-VSBDW0B7PF"
        };
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : undefined;

        let firebaseApp, db, auth;
        try {
            firebaseApp = initializeApp(firebaseConfig);
            db = getFirestore(firebaseApp);
            auth = getAuth(firebaseApp);
        } catch (e) {
            console.error("Firebase Init Error:", e);
        }

        let authMode = 'login';
        let currentUser = null;
        let currentChatId = null;
        let activeTab = 'chats';
        let chatsData = [];
        let contactsData = [];
        let followRequestsData = [];
        let sentRequestsData = [];
        let blockedUsersData = []; // Todos os bloqueios cadastrados no banco
        let messagesData = [];
        let usersDirectory = [];
        let unsubscribeMessages = null;
        
        let geminiApiKey = localStorage.getItem('gemini_api_key') || '';
        let geminiModel = 'gemini-3.5-flash-lite';
        localStorage.setItem('gemini_model', 'gemini-3.5-flash-lite');

        async function ensureAuth() {
            if (!auth) return null;
            if (auth.currentUser) return auth.currentUser;
            try {
                if (initialAuthToken) {
                    const cred = await signInWithCustomToken(auth, initialAuthToken);
                    return cred.user;
                } else {
                    const cred = await signInAnonymously(auth);
                    return cred.user;
                }
            } catch (err) {
                console.error("Auth error:", err);
                try {
                    const cred = await signInAnonymously(auth);
                    return cred.user;
                } catch (fallbackErr) {
                    console.error("Fallback auth error:", fallbackErr);
                    return null;
                }
            }
        }

        function getChatDisplayName(chat) {
            if (chat.isGroup) return chat.name;
            if (!chat.participants) return 'Conversa';
            const myUser = (currentUser.usernameLower || currentUser.username || '').toLowerCase();
            const otherUsername = chat.participants.find(p => p.toLowerCase() !== myUser);
            if (!otherUsername) return currentUser.displayName || currentUser.username;
            const matchedUser = usersDirectory.find(u => (u.usernameLower || u.username || '').toLowerCase() === otherUsername.toLowerCase());
            return matchedUser && matchedUser.displayName ? matchedUser.displayName : otherUsername;
        }

        function getChatAvatar(chat) {
            if (chat.isGroup) return chat.avatar || `https://placehold.co/100x100/202c33/e9edef?text=${(chat.name || 'G').charAt(0)}`;
            const myUser = (currentUser.usernameLower || currentUser.username || '').toLowerCase();
            const otherUsername = chat.participants.find(p => p.toLowerCase() !== myUser) || currentUser.username;
            const matchedUser = usersDirectory.find(u => (u.usernameLower || u.username || '').toLowerCase() === otherUsername.toLowerCase());
            if (matchedUser && matchedUser.avatar) return matchedUser.avatar;
            return `https://placehold.co/100x100/00a884/e9edef?text=${otherUsername.charAt(0).toUpperCase()}`;
        }

        function getSenderDisplayName(username) {
            if (!username) return 'Usuário';
            if (username === 'gemini_bot') return '🤖 Gemini IA';
            if (username.toLowerCase() === currentUser.username.toLowerCase()) return currentUser.displayName || currentUser.username;
            const matchedUser = usersDirectory.find(u => (u.usernameLower || u.username || '').toLowerCase() === username.toLowerCase());
            return matchedUser && matchedUser.displayName ? matchedUser.displayName : username;
        }

        // VERIFICAÇÃO DE BLOQUEIO BIDIRECIONAL CORRIGIDA:
        // Retorna true se EU bloqueei o usuário OU se O USUÁRIO me bloqueou.
        function isUserBlocked(username) {
            if (!username) return false;
            const myUser = (currentUser.usernameLower || currentUser.username || '').toLowerCase();
            const targetUser = username.toLowerCase();

            return blockedUsersData.some(b => {
                const owner = (b.ownerUsername || '').toLowerCase();
                const blocked = (b.blockedUser || '').toLowerCase();
                // Caso 1: Eu sou o dono do bloqueio e bloqueei o target
                // Caso 2: O target é o dono do bloqueio e me bloqueou
                return (owner === myUser && blocked === targetUser) || (owner === targetUser && blocked === myUser);
            });
        }

        function canSendMessageTo(username) {
            if (!username) return false;
            const uLower = username.toLowerCase();
            return contactsData.some(c => c.name.toLowerCase() === uLower);
        }

        const USERS_PATH = () => collection(db, 'artifacts', appId, 'public', 'data', 'users');
        const CONTACTS_PATH = () => collection(db, 'artifacts', appId, 'public', 'data', 'contacts');
        const FOLLOW_REQUESTS_PATH = () => collection(db, 'artifacts', appId, 'public', 'data', 'follow_requests');
        const BLOCKED_PATH = () => collection(db, 'artifacts', appId, 'public', 'data', 'blocked');
        const CHATS_PATH = () => collection(db, 'artifacts', appId, 'public', 'data', 'chats');
        const MESSAGES_PATH = () => collection(db, 'artifacts', appId, 'public', 'data', 'messages');

        window.addEventListener('DOMContentLoaded', async () => {
            await ensureAuth();
            const savedUser = localStorage.getItem('cyberchat_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                document.getElementById('auth-view').classList.add('hidden');
                document.getElementById('main-view').classList.remove('hidden');
                initDashboard();
            } else {
                document.getElementById('auth-view').classList.remove('hidden');
            }
        });

        const tabAuthLogin = document.getElementById('auth-tab-login');
        const tabAuthRegister = document.getElementById('auth-tab-register');
        const authBtnText = document.getElementById('auth-btn-text');
        const usernameError = document.getElementById('username-error');

        tabAuthLogin.addEventListener('click', () => {
            authMode = 'login';
            tabAuthLogin.className = "flex-1 py-2 text-xs font-semibold rounded-md bg-whatsapp-green text-white transition";
            tabAuthRegister.className = "flex-1 py-2 text-xs font-semibold rounded-md text-whatsapp-subtext hover:text-whatsapp-text transition";
            authBtnText.textContent = 'Entrar na Conta';
            usernameError.classList.add('hidden');
        });

        tabAuthRegister.addEventListener('click', () => {
            authMode = 'register';
            tabAuthRegister.className = "flex-1 py-2 text-xs font-semibold rounded-md bg-whatsapp-green text-white transition";
            tabAuthLogin.className = "flex-1 py-2 text-xs font-semibold rounded-md text-whatsapp-subtext hover:text-whatsapp-text transition";
            authBtnText.textContent = 'Criar Conta';
            usernameError.classList.add('hidden');
        });

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('username-input').value.trim();
            const passwordInput = document.getElementById('password-input').value.trim();
            usernameError.classList.add('hidden');

            if (!/^[a-zA-Z0-9]+$/.test(usernameInput)) {
                usernameError.textContent = 'Apenas letras e números no usuário!';
                usernameError.classList.remove('hidden');
                return;
            }

            try {
                const firebaseAuthUser = await ensureAuth();
                const usernameLower = usernameInput.toLowerCase();
                const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', usernameLower);
                const userDocSnap = await getDoc(userDocRef);

                let isNew = false;
                if (authMode === 'login') {
                    if (!userDocSnap.exists()) {
                        usernameError.textContent = 'Conta não encontrada!';
                        usernameError.classList.remove('hidden');
                        return;
                    }
                    const data = userDocSnap.data();
                    if (data.password && data.password !== passwordInput) {
                        usernameError.textContent = 'Senha incorreta!';
                        usernameError.classList.remove('hidden');
                        return;
                    }
                    currentUser = { uid: data.uid || usernameLower, username: data.username || usernameInput, usernameLower, displayName: data.displayName || usernameInput, avatar: data.avatar };
                } else {
                    if (userDocSnap.exists()) {
                        usernameError.textContent = 'Usuário já existe!';
                        usernameError.classList.remove('hidden');
                        return;
                    }
                    isNew = true;
                    currentUser = { 
                        uid: firebaseAuthUser.uid, 
                        username: usernameInput, 
                        usernameLower, 
                        displayName: usernameInput, 
                        avatar: `https://placehold.co/100x100/00a884/e9edef?text=${usernameInput.charAt(0).toUpperCase()}` 
                    };
                    await setDoc(userDocRef, { ...currentUser, password: passwordInput, createdAt: new Date().toISOString() });
                }

                localStorage.setItem('cyberchat_user', JSON.stringify(currentUser));
                document.getElementById('auth-view').classList.add('hidden');
                document.getElementById('main-view').classList.remove('hidden');
                initDashboard();
                if (isNew) setTimeout(openMyNameModal, 300);
            } catch (err) {
                usernameError.textContent = 'Erro ao autenticar: ' + err.message;
                usernameError.classList.remove('hidden');
            }
        });

        function initDashboard() {
            document.getElementById('my-avatar').src = currentUser.avatar;
            document.getElementById('my-name-display').textContent = currentUser.displayName || currentUser.username;
            document.getElementById('my-phone-display').textContent = `@${currentUser.username}`;
            loadDirectoryAndData();
        }

        async function loadDirectoryAndData() {
            onSnapshot(USERS_PATH(), (snapshot) => {
                usersDirectory = [];
                snapshot.forEach(docSnap => usersDirectory.push({ id: docSnap.id, ...docSnap.data() }));
                if (activeTab === 'chats') renderSidebarList();
            });

            onSnapshot(CONTACTS_PATH(), (snapshot) => {
                contactsData = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if ((data.ownerUsername || '').toLowerCase() === (currentUser.usernameLower || currentUser.username).toLowerCase()) {
                        contactsData.push({ id: docSnap.id, ...data });
                    }
                });
                if (activeTab === 'contacts') renderSidebarList();
            });

            onSnapshot(FOLLOW_REQUESTS_PATH(), (snapshot) => {
                followRequestsData = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if ((data.targetUsername || '').toLowerCase() === (currentUser.usernameLower || currentUser.username).toLowerCase()) {
                        followRequestsData.push({ id: docSnap.id, ...data });
                    }
                });
                updateNotificationBadge();
            });

            // Carrega TODOS os bloqueios do sistema para poder checar se fomos bloqueados também
            onSnapshot(BLOCKED_PATH(), (snapshot) => {
                blockedUsersData = [];
                snapshot.forEach(docSnap => {
                    blockedUsersData.push({ id: docSnap.id, ...docSnap.data() });
                });
                if (currentChatId) {
                    const activeChat = chatsData.find(c => c.id === currentChatId);
                    if (activeChat && !activeChat.isGroup) {
                        const otherUsername = activeChat.participants.find(p => p.toLowerCase() !== (currentUser.usernameLower || currentUser.username).toLowerCase());
                        updateChatInputState(otherUsername);
                    }
                }
            });

            onSnapshot(CHATS_PATH(), (snapshot) => {
                chatsData = [];
                snapshot.forEach(docSnap => {
                    const chat = { id: docSnap.id, ...docSnap.data() };
                    const myUser = (currentUser.usernameLower || currentUser.username || '').toLowerCase();
                    if (chat.participants && chat.participants.some(p => p.toLowerCase() === myUser)) {
                        chatsData.push(chat);
                    }
                });

        async function openChat(chat) {
            currentChatId = chat.id;
            document.getElementById('no-chat-selected').classList.add('hidden');
            document.getElementById('active-chat').classList.remove('hidden');
            document.getElementById('active-chat-name').textContent = getChatDisplayName(chat);
            document.getElementById('active-chat-avatar').src = getChatAvatar(chat);
            
            if (chat.isGroup) {
                document.getElementById('active-chat-status').textContent = `Grupo • ${chat.participants.length} membros (Criador: ${chat.creator || 'Desconhecido'})`;
                updateChatInputState(null);
            } else {
                document.getElementById('active-chat-status').textContent = 'E2EE Criptografado';
                const otherUsername = chat.participants.find(p => p.toLowerCase() !== (currentUser.usernameLower || currentUser.username).toLowerCase());
                updateChatInputState(otherUsername);
            }

            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('hidden');
                document.getElementById('chat-area').classList.remove('hidden');
            }

            if (unsubscribeMessages) unsubscribeMessages();
            unsubscribeMessages = onSnapshot(MESSAGES_PATH(), (snapshot) => {
                messagesData = [];
                snapshot.forEach(docSnap => {
                    const msg = { id: docSnap.id, ...docSnap.data() };
                    if (msg.chatId === currentChatId) messagesData.push(msg);
                });
                messagesData.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
                renderMessages();
            });

        function openImageStoragePicker(onImageReady) {
            const fileInput = document.getElementById('hidden-file-input');

        async function fetchGeminiResponse(prompt, chatId) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${geminiModel}:generateContent?key=${geminiApiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || "Erro na API Gemini.");

                const replyText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sem resposta da IA.";
                const botMsgId = 'msg_' + Math.random().toString(36).substring(2, 12);
                
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'messages', botMsgId), {
                    id: botMsgId,
                    chatId,
                    sender: 'gemini_bot',
                    text: replyText,
                    timestamp: new Date().toISOString()
                });

                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'chats', chatId), {
                    lastMessage: `Gemini: ${replyText.substring(0, 30)}...`,
                    lastTime: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                });
            } catch (err) {
                showCustomModal("Erro no Gemini", err.message);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            if (!input) return;
            const text = input.value.trim();
            if (!text || !currentChatId) return;

            const activeChat = chatsData.find(c => c.id === currentChatId);
            if (!activeChat.isGroup) {
                const otherUsername = activeChat.participants.find(p => p.toLowerCase() !== (currentUser.usernameLower || currentUser.username).toLowerCase());
                if (otherUsername && (isUserBlocked(otherUsername) || !canSendMessageTo(otherUsername))) return;
            }

            input.value = '';
            const msgId = 'msg_' + Math.random().toString(36).substring(2, 12);
            const msg = {
                id: msgId,
                chatId: currentChatId,
                sender: currentUser.username,
                text,
                timestamp: new Date().toISOString()
            };

            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'messages', msgId), msg);
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'chats', currentChatId), {
                lastMessage: `${currentUser.displayName}: ${text}`,
                lastTime: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });

            if (text.toLowerCase().startsWith('@gemini ')) {
                if (!geminiApiKey) {
                    showCustomModal("API Key Ausente", "Configure sua chave do Gemini clicando na engrenagem no topo.");
                    return;
                }
                const prompt = text.substring(8).trim();
                if (prompt) fetchGeminiResponse(prompt, currentChatId);
            }
        }

        function escapeHtml(str) {
            return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }

        function showCustomModal(title, text) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = `<p class="text-sm text-whatsapp-subtext whitespace-pre-line">${text}</p>`;
            document.getElementById('modal-footer').innerHTML = `<button onclick="closeModal()" class="bg-whatsapp-green text-white px-4 py-2 rounded-lg text-sm">OK</button>`;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function showCustomModalWithOptions(title, buttonText, text, onAction) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = `<p class="text-sm text-whatsapp-subtext">${text}</p>`;
            document.getElementById('modal-footer').innerHTML = `<button onclick="closeModal()" class="bg-whatsapp-inputBg text-whatsapp-text px-4 py-2 rounded-lg text-sm">Cancelar</button><button id="modal-action-btn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">${buttonText}</button>`;
            document.getElementById('custom-modal').classList.remove('hidden');
            document.getElementById('modal-action-btn').onclick = onAction;
        }

        function showModalConfirmAction(title, text, onConfirm) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = `<p class="text-sm text-whatsapp-subtext">${text}</p>`;
            document.getElementById('modal-footer').innerHTML = `<button onclick="closeModal()" class="bg-whatsapp-inputBg text-whatsapp-text px-4 py-2 rounded-lg text-sm">Cancelar</button><button id="modal-action-confirm" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Apagar</button>`;
            document.getElementById('custom-modal').classList.remove('hidden');
            document.getElementById('modal-action-confirm').onclick = onConfirm;
        }

        function showModalForm(title, fields, onSubmit) {
            document.getElementById('modal-title').textContent = title;
            let html = `<div class="flex flex-col gap-3">`;
            fields.forEach(f => {
                html += `<div><label class="block text-xs text-whatsapp-subtext mb-1">${f.label}</label><input type="${f.type || 'text'}" id="modal-${f.id}" value="${f.value || ''}" placeholder="${f.placeholder || ''}" class="w-full bg-whatsapp-inputBg border border-whatsapp-border rounded-lg px-3 py-2 text-sm text-whatsapp-text"></div>`;
            });
            html += `</div>`;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal-footer').innerHTML = `<button onclick="closeModal()" class="bg-whatsapp-inputBg text-whatsapp-text px-4 py-2 rounded-lg text-sm">Cancelar</button><button id="modal-submit" class="bg-whatsapp-green text-white px-4 py-2 rounded-lg text-sm">Salvar</button>`;
            document.getElementById('custom-modal').classList.remove('hidden');

            document.getElementById('modal-submit').onclick = () => {
                const vals = {};
                fields.forEach(f => vals[f.id] = document.getElementById(`modal-${f.id}`).value);
                closeModal();
                onSubmit(vals);
            };
        }

        window.closeModal = () => document.getElementById('custom-modal').classList.add('hidden');

        document.getElementById('btn-settings').addEventListener('click', () => {
            showModalForm("Configurar Gemini API", [
                { id: 'key', label: 'Chave API do Gemini', value: geminiApiKey, placeholder: 'AIzaSy...' }
            ], (vals) => {
                geminiApiKey = vals['key'].trim();
                if (geminiApiKey) localStorage.setItem('gemini_api_key', geminiApiKey);
                showCustomModal("Sucesso", "Chave API salva com sucesso! Modelo padrão ativo: gemini-3.5-flash-lite.");
            });
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            localStorage.removeItem('cyberchat_user');
            location.reload();
        });
    </script>
</body>
</html>
