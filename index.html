<body class="h-full w-full flex flex-col">

    <div id="app" class="h-full w-full flex flex-col relative overflow-hidden">
        <!-- Auth / Login View -->
        <div id="auth-view" class="absolute inset-0 flex items-center justify-center bg-whatsapp-darker p-4 overflow-y-auto z-20">
            <div class="bg-whatsapp-dark w-full max-w-md p-6 sm:p-8 rounded-xl shadow-2xl border border-whatsapp-border flex flex-col items-center my-auto">

        <div id="main-view" class="absolute inset-0 flex hidden z-10 overflow-hidden">
            <!-- Sidebar -->
            <div id="sidebar" class="w-full md:w-[380px] lg:w-[420px] h-full bg-whatsapp-dark border-r border-whatsapp-border flex flex-col z-10 shrink-0">
                <div class="bg-whatsapp-panel px-4 py-3 flex items-center justify-between border-b border-whatsapp-border">
                    <div class="flex items-center gap-3 min-w-0">
                        <img id="my-avatar" src="" class="w-10 h-10 rounded-full object-cover border border-whatsapp-border cursor-pointer hover:opacity-80 transition shrink-0" title="Clique para alterar a foto do seu perfil" alt="Perfil">
                        <div class="min-w-0 cursor-pointer group flex-1" id="profile-name-trigger" title="Clique para alterar seu nome">
                            <h3 id="my-name-display" class="font-medium text-sm text-whatsapp-text truncate group-hover:underline">Nome</h3>

                <div class="p-2 bg-whatsapp-dark border-b border-whatsapp-border flex items-center gap-2">
                    <div class="flex-1 bg-whatsapp-inputBg rounded-lg flex items-center px-3 py-1.5 gap-3 border border-whatsapp-border focus-within:border-whatsapp-green">
                        <i class="fa-solid fa-magnifying-glass text-whatsapp-subtext text-sm"></i>
                        <input type="text" id="search-input" placeholder="Pesquisar conversas" class="w-full bg-transparent text-sm text-whatsapp-text focus:outline-none placeholder-whatsapp-subtext">

            <!-- Chat Main Area -->

                <div id="no-chat-selected" class="flex-1 flex flex-col items-center justify-center p-6 text-center bg-whatsapp-darker border-b-8 border-whatsapp-green">
                    <div class="w-48 h-48 opacity-40 mb-6 flex items-center justify-center text-7xl text-whatsapp-subtext">

                    <h2 class="text-2xl font-light text-whatsapp-text mb-2">CyberChat Web E2EE</h2>
                    <p class="text-sm text-whatsapp-subtext max-w-md">Suas mensagens, fotos, áudios e grupos são 100% protegidos por criptografia de ponta a ponta irrestrita.</p>
                </div>

                <div id="active-chat" class="flex-1 flex flex-col h-full hidden min-w-0">
                    <div class="bg-whatsapp-panel px-4 py-3 flex items-center justify-between border-b border-whatsapp-border">
                        <div class="flex items-center gap-3 min-w-0">

                            <img id="active-chat-avatar" src="" class="w-10 h-10 rounded-full object-cover border border-whatsapp-border shrink-0 cursor-pointer hover:opacity-80 transition" title="Foto" alt="Avatar">
                            <div id="active-chat-name-trigger" class="flex items-center gap-3 cursor-pointer min-w-0 group flex-1" title="Opções">
                                <div class="min-w-0">
                                    <h3 id="active-chat-name" class="font-medium text-sm text-whatsapp-text truncate group-hover:underline">Nome</h3>
                                    <span id="active-chat-status" class="text-xs text-whatsapp-subtext block truncate"><i class="fa-solid fa-lock text-[10px] text-whatsapp-green mr-1"></i>E2EE Ativo</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="messages-container" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2 bg-[radial-gradient(#202c33_1px,transparent_1px)] [background-size:16px_16px] bg-whatsapp-darker"></div>

                    <!-- Input Footer -->
                    <div id="chat-input-footer" class="bg-whatsapp-panel px-4 py-3 flex items-center gap-3 border-t border-whatsapp-border relative">

                        <button id="btn-send-photo" title="Enviar Foto (Máx 500KB)" class="text-whatsapp-subtext text-xl hover:text-whatsapp-green transition">
                            <i class="fa-solid fa-camera"></i>
                        </button>
                        <button id="btn-send-audio" title="Gravar Áudio (Máx 60s)" class="text-whatsapp-subtext text-xl hover:text-whatsapp-green transition">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                        <div class="flex-1 relative flex items-center">
                            <input type="text" id="message-input" maxlength="450" placeholder="Digite uma mensagem (máx 450 caracteres)..." class="w-full bg-whatsapp-inputBg text-whatsapp-text rounded-lg px-4 py-2.5 text-sm focus:outline-none border border-whatsapp-border focus:border-whatsapp-green pr-14">
                            <span id="char-counter" class="absolute right-3 text-[10px] text-whatsapp-subtext">0/450</span>
                        </div>
                        <button id="btn-send-message" class="text-whatsapp-subtext text-xl hover:text-whatsapp-green transition">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>

            </div>

        <!-- Custom Modal -->
        <div id="custom-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50 hidden p-4">
            <div id="modal-content" class="bg-whatsapp-dark border border-whatsapp-border w-full max-w-md rounded-xl p-6 shadow-2xl flex flex-col">
                <h3 id="modal-title" class="text-lg font-bold text-whatsapp-text mb-4">Título</h3>
                <div id="modal-body" class="mb-6 max-h-[60vh] overflow-y-auto"></div>
                <div id="modal-footer" class="flex justify-end gap-3">
                    <button onclick="closeModal()" class="bg-whatsapp-inputBg hover:bg-whatsapp-border text-whatsapp-text px-4 py-2 rounded-lg text-sm transition">Cancelar</button>
                    <button id="modal-confirm" class="bg-whatsapp-green hover:bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'cyberchat-414be';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyBVPT5i8EBEYMR6Ig7hw_0fXXTQNlEJIlg",
            authDomain: "cyberchat-414be.firebaseapp.com",
            databaseURL: "https://cyberchat-414be-default-rtdb.firebaseio.com",
            projectId: "cyberchat-414be",
            storageBucket: "cyberchat-414be.firebasestorage.app",
            messagingSenderId: "865992019962",
            appId: "1:865992019962:web:9fbafccbc9150e415d9e43",
            measurementId: "G-VSBDW0B7PF"
        };
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : undefined;

        let firebaseApp, db, auth;
        try {
            firebaseApp = initializeApp(firebaseConfig);
            db = getFirestore(firebaseApp);
            auth = getAuth(firebaseApp);
        } catch (e) {
            console.error("Firebase Init Error:", e);
        }

        let authMode = 'login';
        let currentUser = null;
        let currentChatId = null;
        let activeTab = 'chats';
        let chatsData = [];
        let contactsData = [];
        let followRequestsData = [];
        let blockedUsersData = [];
        let messagesData = [];
        let usersDirectory = [];
        let groupKeysCache = {}; 
        let unsubscribeMessages = null;
        let activeReply = null; // Guarda a mensagem que está sendo respondida
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let recordingTimeout = null;
        let realtimeTimerInterval = null;

        const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;

        // --- SISTEMA DE PRESENÇA (ONLINE/OFFLINE) ---
        let presenceTimeout = null;
        window.updateOnlineStatus = (isOnline) => {
            if (!currentUser) return;
            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'users', currentUser.usernameLower);
            updateDoc(ref, { isOnline, lastSeen: new Date().toISOString() }).catch(()=>{});
        };

        window.handleVisibility = () => {
            if (presenceTimeout) clearTimeout(presenceTimeout);
            presenceTimeout = setTimeout(() => {
                window.updateOnlineStatus(!document.hidden);
            }, 5000);
        };
        document.addEventListener('visibilitychange', window.handleVisibility);
        window.addEventListener('beforeunload', () => {
            if (currentUser) window.updateOnlineStatus(false);
        });

        // --- SISTEMA CRIPTOGRÁFICO AVANÇADO E2EE ---
        async function exportPublicKey(key) {
            return await window.crypto.subtle.exportKey("jwk", key);
        }

        async function importPublicKey(jwk) {
            return await window.crypto.subtle.importKey("jwk", jwk, { name: "ECDH", namedCurve: "P-256" }, true, []);
        }

        async function generateKeyPair() {
            return await window.crypto.subtle.generateKey({ name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey", "deriveBits"]);
        }

        async function generateAESKey() {
            return await window.crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
        }

        async function deriveSharedSecretKey(privateKey, remotePublicKey) {
            return await window.crypto.subtle.deriveKey(
                { name: "ECDH", public: remotePublicKey },
                privateKey,
                { name: "AES-GCM", length: 256 },
                true,
                ["encrypt", "decrypt"]
            );
        }

        async function encryptMessage(text, aesKey) {
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const encoded = new TextEncoder().encode(text);
            const ciphertext = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, aesKey, encoded);

            let ivBinary = '';
            for (let i = 0; i < iv.length; i++) ivBinary += String.fromCharCode(iv[i]);

            const cipherBytes = new Uint8Array(ciphertext);
            let cipherBinary = '';
            const chunkSize = 8192;
            for (let i = 0; i < cipherBytes.length; i += chunkSize) {
                cipherBinary += String.fromCharCode(...cipherBytes.subarray(i, i + chunkSize));
            }

            return { iv: btoa(ivBinary), data: btoa(cipherBinary) };
        }

        async function decryptMessage(encryptedObj, aesKey) {
            try {
                const iv = Uint8Array.from(atob(encryptedObj.iv), c => c.charCodeAt(0));
                const data = Uint8Array.from(atob(encryptedObj.data), c => c.charCodeAt(0));
                const decrypted = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, aesKey, data);
                return new TextDecoder().decode(decrypted);
            } catch (err) {
                return "[Erro E2EE]";
            }
        }

        async function savePrivateKeyToStorage(username, privateKey) {
            const jwk = await window.crypto.subtle.exportKey("jwk", privateKey);
            localStorage.setItem(`cyberchat_priv_${username.toLowerCase()}`, JSON.stringify(jwk));
        }

        async function loadPrivateKeyFromStorage(username) {
            const jwkStr = localStorage.getItem(`cyberchat_priv_${username.toLowerCase()}`);
            if (!jwkStr) return null;
            const jwk = JSON.parse(jwkStr);
            return await window.crypto.subtle.importKey(
                "jwk", jwk, { name: "ECDH", namedCurve: "P-256" }, true, ["deriveKey", "deriveBits"]
            );
        }

        async function ensureAuth() {
            if (!auth) return null;
            if (auth.currentUser) return auth.currentUser;
            try {
                if (initialAuthToken) {
                    const cred = await signInWithCustomToken(auth, initialAuthToken);
                    return cred.user;
                } else {
                    const cred = await signInAnonymously(auth);
                    return cred.user;
                }
            } catch (err) {
                try {
                    const cred = await signInAnonymously(auth);
                    return cred.user;
                } catch (fallbackErr) {
                    return null;
                }
            }
        }

        function getChatDisplayName(chat) {
            if (chat.isGroup) return chat.decryptedName || chat.name;
            if (!chat.participants) return 'Conversa';
            const myUser = (currentUser.usernameLower || currentUser.username || '').toLowerCase();
            const otherUsername = chat.participants.find(p => p.toLowerCase() !== myUser);
            if (!otherUsername) return currentUser.displayName || currentUser.username;
            const matchedUser = usersDirectory.find(u => (u.usernameLower || u.username || '').toLowerCase() === otherUsername.toLowerCase());
            return matchedUser && matchedUser.displayName ? matchedUser.displayName : otherUsername;
        }

        function getChatAvatar(chat) {
            if (chat.isGroup) return chat.avatar || `https://placehold.co/100x100/202c33/e9edef?text=*`;
            const myUser = (currentUser.usernameLower || currentUser.username || '').toLowerCase();
            const otherUsername = chat.participants.find(p => p.toLowerCase() !== myUser) || currentUser.username;
            const matchedUser = usersDirectory.find(u => (u.usernameLower || u.username || '').toLowerCase() === otherUsername.toLowerCase());
            if (matchedUser && matchedUser.avatar) return matchedUser.avatar;
            return `https://placehold.co/100x100/00a884/e9edef?text=${otherUsername.charAt(0).toUpperCase()}`;
        }

        function getSenderDisplayName(username) {
            if (!username) return 'Usuário';
            if (username.toLowerCase() === currentUser.username.toLowerCase()) return currentUser.displayName || currentUser.username;
            const matchedUser = usersDirectory.find(u => (u.usernameLower || u.username || '').toLowerCase() === username.toLowerCase());
            return matchedUser && matchedUser.displayName ? matchedUser.displayName : username;
        }

        function isUserBlocked(username) {
            if (!username) return false;
            const myUser = (currentUser.usernameLower || currentUser.username || '').toLowerCase();
            const targetUser = username.toLowerCase();
            return blockedUsersData.some(b => {
                const owner = (b.ownerUsername || '').toLowerCase();
                const blocked = (b.blockedUser || '').toLowerCase();
                return (owner === myUser && blocked === targetUser) || (owner === targetUser && blocked === myUser);
            });
        }

        function canSendMessageTo(username) {
            if (!username) return false;
            const uLower = username.toLowerCase();
            return contactsData.some(c => c.name.toLowerCase() === uLower);
        }

        const USERS_PATH = () => collection(db, 'artifacts', appId, 'public', 'data', 'users');
        const CONTACTS_PATH = () => collection(db, 'artifacts', appId, 'public', 'data', 'contacts');
        const FOLLOW_REQUESTS_PATH = () => collection(db, 'artifacts', appId, 'public', 'data', 'follow_requests');
        const BLOCKED_PATH = () => collection(db, 'artifacts', appId, 'public', 'data', 'blocked');
        const CHATS_PATH = () => collection(db, 'artifacts', appId, 'public', 'data', 'chats');
        const MESSAGES_PATH = () => collection(db, 'artifacts', appId, 'public', 'data', 'messages');

        window.addEventListener('DOMContentLoaded', async () => {
            await ensureAuth();
            const savedUser = localStorage.getItem('cyberchat_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                currentUser.privateKey = await loadPrivateKeyFromStorage(currentUser.username);
                document.getElementById('auth-view').classList.add('hidden');
                document.getElementById('main-view').classList.remove('hidden');
                initDashboard();
            } else {
                document.getElementById('auth-view').classList.remove('hidden');
            }
        });

        const tabAuthLogin = document.getElementById('auth-tab-login');
        const tabAuthRegister = document.getElementById('auth-tab-register');
        const authBtnText = document.getElementById('auth-btn-text');
        const usernameError = document.getElementById('username-error');

        tabAuthLogin.addEventListener('click', () => {
            authMode = 'login';
            tabAuthLogin.className = "flex-1 py-2 text-xs font-semibold rounded-md bg-whatsapp-green text-white transition";
            tabAuthRegister.className = "flex-1 py-2 text-xs font-semibold rounded-md text-whatsapp-subtext hover:text-whatsapp-text transition";
            authBtnText.textContent = 'Entrar na Conta';
            usernameError.classList.add('hidden');
        });

        tabAuthRegister.addEventListener('click', () => {
            authMode = 'register';
            tabAuthRegister.className = "flex-1 py-2 text-xs font-semibold rounded-md bg-whatsapp-green text-white transition";
            tabAuthLogin.className = "flex-1 py-2 text-xs font-semibold rounded-md text-whatsapp-subtext hover:text-whatsapp-text transition";
            authBtnText.textContent = 'Criar Conta';
            usernameError.classList.add('hidden');
        });

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('username-input').value.trim();
            const passwordInput = document.getElementById('password-input').value.trim();
            usernameError.classList.add('hidden');

            if (!/^[a-zA-Z0-9_]+$/.test(usernameInput)) {
                usernameError.textContent = 'Apenas letras, números e o símbolo "_" são permitidos!';
                usernameError.classList.remove('hidden');
                return;
            }

            try {
                const firebaseAuthUser = await ensureAuth();
                const usernameLower = usernameInput.toLowerCase();
                const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', usernameLower);
                const userDocSnap = await getDoc(userDocRef);

                let isNew = false;
                if (authMode === 'login') {
                    if (!userDocSnap.exists()) {
                        usernameError.textContent = 'Conta não encontrada!';
                        usernameError.classList.remove('hidden');
                        return;
                    }
                    const data = userDocSnap.data();
                    if (data.password && data.password !== passwordInput) {
                        usernameError.textContent = 'Senha incorreta!';
                        usernameError.classList.remove('hidden');
                        return;
                    }
                    
                    let privKey = await loadPrivateKeyFromStorage(usernameInput);
                    if (!privKey) {
                        const keyPair = await generateKeyPair();
                        privKey = keyPair.privateKey;
                        await savePrivateKeyToStorage(usernameInput, privKey);
                        const pubJwk = await exportPublicKey(keyPair.publicKey);
                        await updateDoc(userDocRef, { publicKey: pubJwk });
                    }

                    currentUser = { 
                        uid: data.uid || usernameLower, 
                        username: data.username || usernameInput, 
                        usernameLower, 
                        displayName: data.displayName || usernameInput, 
                        avatar: data.avatar,
                        privateKey: privKey 
                    };
                } else {
                    if (userDocSnap.exists()) {
                        usernameError.textContent = 'Usuário já existe!';
                        usernameError.classList.remove('hidden');
                        return;
                    }
                    isNew = true;
                    
                    const keyPair = await generateKeyPair();
                    const pubJwk = await exportPublicKey(keyPair.publicKey);
                    await savePrivateKeyToStorage(usernameInput, keyPair.privateKey);

                    currentUser = { 
                        uid: firebaseAuthUser.uid, 
                        username: usernameInput, 
                        usernameLower, 
                        displayName: usernameInput, 
                        avatar: `https://placehold.co/100x100/00a884/e9edef?text=${usernameInput.charAt(0).toUpperCase()}`,
                        privateKey: keyPair.privateKey
                    };

                    await setDoc(userDocRef, { 
                        ...currentUser, 
                        privateKey: null,
                        publicKey: pubJwk, 
                        password: passwordInput, 
                        createdAt: new Date().toISOString() 
                    });
                }

                const sessionData = { uid: currentUser.uid, username: currentUser.username, usernameLower, displayName: currentUser.displayName, avatar: currentUser.avatar };
                localStorage.setItem('cyberchat_user', JSON.stringify(sessionData));
                document.getElementById('auth-view').classList.add('hidden');
                document.getElementById('main-view').classList.remove('hidden');
                initDashboard();
                if (isNew) setTimeout(openMyNameModal, 300);
            } catch (err) {
                usernameError.textContent = 'Erro ao autenticar: ' + err.message;
                usernameError.classList.remove('hidden');
            }
        });

        async function getChatDecryptionKey(chat) {
            if (chat.isGroup) {
                if (groupKeysCache[chat.id]) return groupKeysCache[chat.id];
                if (chat.encryptedKeys && chat.encryptedKeys[currentUser.username]) {
                    const creatorDoc = usersDirectory.find(u => u.usernameLower === chat.creator.toLowerCase());
                    if (creatorDoc && creatorDoc.publicKey && currentUser.privateKey) {
                        try {
                            const creatorPub = await importPublicKey(creatorDoc.publicKey);
                            const shared = await deriveSharedSecretKey(currentUser.privateKey, creatorPub);
                            const decStr = await decryptMessage(chat.encryptedKeys[currentUser.username], shared);
                            if (decStr && !decStr.startsWith("[Erro")) {
                                const rawArray = Uint8Array.from(atob(decStr), c => c.charCodeAt(0));
                                const key = await window.crypto.subtle.importKey(
                                    "raw", rawArray, { name: "AES-GCM" }, true, ["encrypt", "decrypt"]
                                );
                                groupKeysCache[chat.id] = key;
                                return key;
                            }
                        } catch(e) {}
                    }
                }
            } else {
                const other = chat.participants.find(p => p.toLowerCase() !== currentUser.usernameLower);
                if (other && currentUser.privateKey) {
                    const targetDoc = usersDirectory.find(u => u.usernameLower === other.toLowerCase());
                    if (targetDoc && targetDoc.publicKey) {
                        try {
                            const remotePub = await importPublicKey(targetDoc.publicKey);
                            return await deriveSharedSecretKey(currentUser.privateKey, remotePub);
                        } catch(e) {}
                    }
                }
            }
            return null;
        }

        async function loadDirectoryAndData() {
            onSnapshot(USERS_PATH(), (snapshot) => {
                usersDirectory = [];
                snapshot.forEach(docSnap => usersDirectory.push({ id: docSnap.id, ...docSnap.data() }));
                if (activeTab === 'chats') renderSidebarList();
            });

            onSnapshot(CONTACTS_PATH(), (snapshot) => {
                contactsData = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if ((data.ownerUsername || '').toLowerCase() === (currentUser.usernameLower || currentUser.username).toLowerCase()) {
                        contactsData.push({ id: docSnap.id, ...data });
                    }
                });
                if (activeTab === 'contacts') renderSidebarList();
            });

            onSnapshot(FOLLOW_REQUESTS_PATH(), (snapshot) => {
                followRequestsData = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if ((data.targetUsername || '').toLowerCase() === (currentUser.usernameLower || currentUser.username).toLowerCase()) {
                        followRequestsData.push({ id: docSnap.id, ...data });
                    }
                });
                updateNotificationBadge();
            });

            onSnapshot(BLOCKED_PATH(), (snapshot) => {
                blockedUsersData = [];
                snapshot.forEach(docSnap => {
                    blockedUsersData.push({ id: docSnap.id, ...docSnap.data() });
                });
                if (currentChatId) {
                    const activeChat = chatsData.find(c => c.id === currentChatId);
                    if (activeChat && !activeChat.isGroup) {
                        const otherUsername = activeChat.participants.find(p => p.toLowerCase() !== (currentUser.usernameLower || currentUser.username).toLowerCase());
                        updateChatInputState(otherUsername);
                    }
                }
            });

            onSnapshot(CHATS_PATH(), async (snapshot) => {
                const rawChats = [];
                const myUser = (currentUser.usernameLower || currentUser.username || '').toLowerCase();
                
                snapshot.forEach(docSnap => {
                    const chat = { id: docSnap.id, ...docSnap.data() };
                    if (chat.participants && chat.participants.some(p => p.toLowerCase() === myUser)) {
                        rawChats.push(chat);
                    }
                });

                for (let chat of rawChats) {
                    chat.decryptedName = chat.name;
                    chat.decryptedLastMessage = "Sem mensagens legíveis (E2EE)";

                    const aesKey = await getChatDecryptionKey(chat);
                    if (aesKey) {
                        if (chat.isGroup && chat.encryptedName) {
                            const decName = await decryptMessage(chat.encryptedName, aesKey);
                            if (!decName.startsWith("[Erro")) chat.decryptedName = decName;
                        }
                        if (chat.encryptedLastMessage) {
                            const decLast = await decryptMessage(chat.encryptedLastMessage, aesKey);
                            if (!decLast.startsWith("[Erro")) {
                                try {
                                    const parsed = JSON.parse(decLast);
                                    chat.decryptedLastMessage = parsed.text !== undefined ? parsed.text : decLast;
                                } catch(e) { chat.decryptedLastMessage = decLast; }
                            }
                        }
                    }

                    // Se a conversa atual estiver aberta, limpa as contagens de não lidas instantaneamente
                    if (currentChatId === chat.id && chat.unreadCounts && chat.unreadCounts[currentUser.username] > 0) {
                        const newUnread = { ...chat.unreadCounts };
                        newUnread[currentUser.username] = 0;
                        updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'chats', chat.id), { unreadCounts: newUnread }).catch(()=>{});
                    }
                }

                chatsData = rawChats;
                if (activeTab === 'chats') renderSidebarList();
                if (currentChatId) {
                    const activeChat = chatsData.find(c => c.id === currentChatId);
                    if (activeChat) {
                        document.getElementById('active-chat-name').textContent = getChatDisplayName(activeChat);
                        document.getElementById('active-chat-avatar').src = getChatAvatar(activeChat);
                    }
                }
            });
        }

        async function openChat(chat) {
            currentChatId = chat.id;
            window.cancelReply(); // Reseta a resposta ao trocar de chat
            document.getElementById('no-chat-selected').classList.add('hidden');
            document.getElementById('active-chat').classList.remove('hidden');
            document.getElementById('active-chat-name').textContent = getChatDisplayName(chat);
            document.getElementById('active-chat-avatar').src = getChatAvatar(chat);
            
            // Limpa Badge
            if (chat.unreadCounts && chat.unreadCounts[currentUser.username] > 0) {
                const newUnread = { ...chat.unreadCounts };
                newUnread[currentUser.username] = 0;
                updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'chats', chat.id), { unreadCounts: newUnread }).catch(()=>{});
            }

            // Status Online
            if (window.unsubscribeActiveUser) { window.unsubscribeActiveUser(); window.unsubscribeActiveUser = null; }

            if (chat.isGroup) {
                document.getElementById('active-chat-status').textContent = `Grupo E2EE Extremo • ${chat.participants.length} membros`;
                updateChatInputState(null);
            } else {
                document.getElementById('active-chat-status').innerHTML = '<i class="fa-solid fa-lock text-[10px] text-whatsapp-green mr-1"></i>E2EE Ativo';
                const otherUsername = chat.participants.find(p => p.toLowerCase() !== currentUser.usernameLower);
                
                if (otherUsername) {
                    const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', otherUsername.toLowerCase());
                    window.unsubscribeActiveUser = onSnapshot(userRef, (snap) => {
                        if (snap.exists() && currentChatId === chat.id) {
                            const data = snap.data();
                            const statusEl = document.getElementById('active-chat-status');
                            if (data.isOnline) {
                                statusEl.innerHTML = '<i class="fa-solid fa-lock text-[10px] text-whatsapp-green mr-1"></i>E2EE Ativo • <span class="text-emerald-400 font-semibold">Online</span>';
                            } else {
                                statusEl.innerHTML = '<i class="fa-solid fa-lock text-[10px] text-whatsapp-green mr-1"></i>E2EE Ativo';
                            }
                        }
                    });
                }
                updateChatInputState(otherUsername);
            }

            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('hidden');
                document.getElementById('chat-area').classList.remove('hidden');
            }

            if (unsubscribeMessages) unsubscribeMessages();
            unsubscribeMessages = onSnapshot(MESSAGES_PATH(), async (snapshot) => {
                const rawMsgs = [];
                const now = new Date().getTime();

                snapshot.forEach(docSnap => {
                    const msg = { id: docSnap.id, ...docSnap.data() };
                    if (msg.chatId === currentChatId) {
                        const msgTime = new Date(msg.timestamp).getTime();
                        if (now - msgTime > THIRTY_DAYS_MS) {
                            deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'messages', msg.id)).catch(() => {});
                        } else {
                            rawMsgs.push(msg);
                        }
                    }
                });
                rawMsgs.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

                const currentMsgIds = messagesData.map(m => m.id).join(',');
                const newMsgIds = rawMsgs.map(m => m.id).join(',');

                            try {

                                if (parsed.text !== undefined) {

                                    decryptedReply = parsed.replyTo;
                                } else {

                            }
                            if (msg.encryptedMediaPayload) {

                            }

        function handlePhotoUploadClick() {
            const fileInput = document.getElementById('hidden-file-input');
            fileInput.value = '';
            fileInput.accept = 'image/*';
            fileInput.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (file.type.startsWith('video/') || file.name.match(/\.(mp4|avi|mov|mkv|webm|flv|3gp)$/i)) {
                    showCustomModal("Erro", "Envio de vídeos é proibido!");
                    return;
                }

                if (!file.type.startsWith('image/')) {
                    showCustomModal("Erro", "Apenas imagens são permitidas!");
                    return;
                }

                if (file.size > 524288) { // 500KB
                    showCustomModal("Erro", "A foto excede 500KB!");
                    return;
                }

                const reader = new FileReader();
                reader.onload = (uploadEvent) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 800;
                        if (width > maxDim || height > maxDim) {
                            if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; } 
                            else { width = Math.round((width * maxDim) / height); height = maxDim; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        sendMediaMessage(compressedDataUrl, 'photo', '📷 [Foto E2EE]');
                    };
                    img.src = uploadEvent.target.result;
                };
                reader.readAsDataURL(file);
            };
            fileInput.click();
        }

        async function toggleAudioRecording() {
            const btnAudio = document.getElementById('btn-send-audio');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = (event) => { if (event.data.size > 0) audioChunks.push(event.data); };

                    mediaRecorder.onstop = async () => {
                        if (recordingTimeout) clearTimeout(recordingTimeout);
                        recordingTimeout = null;

                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = async (e) => {
                            await sendMediaMessage(e.target.result, 'audio', '🎤 [Áudio E2EE]');
                        };
                        reader.readAsDataURL(audioBlob);

                        stream.getTracks().forEach(track => track.stop());
                        isRecording = false;
                        if (btnAudio) {
                            btnAudio.classList.remove('text-red-500', 'animate-pulse');
                            btnAudio.classList.add('text-whatsapp-subtext');
                            btnAudio.title = "Gravar Áudio (Máx 60s)";
                        }
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    if (btnAudio) {
                        btnAudio.classList.remove('text-whatsapp-subtext');
                        btnAudio.classList.add('text-red-500', 'animate-pulse');
                        btnAudio.title = "Parar Gravação (Gravando...)";
                    }

                    recordingTimeout = setTimeout(() => {
                        if (isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
                    }, 60000);

                } catch (err) {
                    showCustomModal("Erro", "Permissão de microfone negada.");
                    isRecording = false;
                }
            } else {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            }
        }

                    currentUser.avatar = uploadEvent.target.result;
                    const sessionData = { uid: currentUser.uid, username: currentUser.username, usernameLower: currentUser.usernameLower, displayName: currentUser.displayName, avatar: currentUser.avatar };
                    localStorage.setItem('cyberchat_user', JSON.stringify(sessionData));
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', currentUser.usernameLower), { avatar: currentUser.avatar });
                    initDashboard();
                    showCustomModal("Sucesso", "Foto atualizada!");
                };
                reader.readAsDataURL(file);
            };
            fileInput.click();
        });

        function openMyNameModal() {
            showModalForm("Alterar Nome", [{ id: 'nick', label: 'Nome Exibido', value: currentUser.displayName }], async (vals) => {
                const newNick = vals['nick'].trim() || currentUser.username;
                currentUser.displayName = newNick;
                const sessionData = { uid: currentUser.uid, username: currentUser.username, usernameLower: currentUser.usernameLower, displayName: currentUser.displayName, avatar: currentUser.avatar };
                localStorage.setItem('cyberchat_user', JSON.stringify(sessionData));
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', currentUser.usernameLower), { displayName: newNick });
                initDashboard();
            });
        }
        document.getElementById('profile-name-trigger').addEventListener('click', openMyNameModal);

        document.getElementById('btn-back-to-list').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('chat-area').classList.add('hidden');
            currentChatId = null;
        });

        function escapeHtml(str) {
            return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }

        function showCustomModal(title, text) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = `<p class="text-sm text-whatsapp-subtext whitespace-pre-line">${text}</p>`;
            document.getElementById('modal-footer').innerHTML = `<button onclick="closeModal()" class="bg-whatsapp-green text-white px-4 py-2 rounded-lg text-sm">OK</button>`;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function showCustomModalWithOptions(title, buttonText, text, onAction) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = `<p class="text-sm text-whatsapp-subtext">${text}</p>`;
            document.getElementById('modal-footer').innerHTML = `<button onclick="closeModal()" class="bg-whatsapp-inputBg text-whatsapp-text px-4 py-2 rounded-lg text-sm">Cancelar</button><button id="modal-action-btn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">${buttonText}</button>`;
            document.getElementById('custom-modal').classList.remove('hidden');
            document.getElementById('modal-action-btn').onclick = onAction;
        }

        function showModalForm(title, fields, onSubmit) {
            document.getElementById('modal-title').textContent = title;
            let html = `<div class="flex flex-col gap-3">`;
            fields.forEach(f => { html += `<div><label class="block text-xs text-whatsapp-subtext mb-1">${f.label}</label><input type="${f.type || 'text'}" id="modal-${f.id}" value="${f.value || ''}" placeholder="${f.placeholder || ''}" class="w-full bg-whatsapp-inputBg border border-whatsapp-border rounded-lg px-3 py-2 text-sm text-whatsapp-text"></div>`; });
            html += `</div>`;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal-footer').innerHTML = `<button onclick="closeModal()" class="bg-whatsapp-inputBg text-whatsapp-text px-4 py-2 rounded-lg text-sm">Cancelar</button><button id="modal-submit" class="bg-whatsapp-green text-white px-4 py-2 rounded-lg text-sm">Salvar</button>`;
            document.getElementById('custom-modal').classList.remove('hidden');

            document.getElementById('modal-submit').onclick = () => {
                const vals = {};
                fields.forEach(f => vals[f.id] = document.getElementById(`modal-${f.id}`).value);
                closeModal();
                onSubmit(vals);
            };
        }

        window.closeModal = () => document.getElementById('custom-modal').classList.add('hidden');

        document.getElementById('btn-logout').addEventListener('click', () => {
            window.updateOnlineStatus(false);
            localStorage.removeItem('cyberchat_user');
            location.reload();
        });
    </script>
</body>
</html>
